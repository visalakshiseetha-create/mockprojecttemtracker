<!--
  FILE: expenses.html
  ROLE: The Expenses module. Full CRUD expense list with search,
  category + date-range filters, a running total, a category
  donut chart, and a last-6-months bar chart. Logic in js/app.js
  + js/chart.js (shared) and js/expenses.js (page).
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beacon — Expenses</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/glass-3d.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-background"></div>
  <div class="orb orb-1"></div>

  <div class="app-shell">
    <aside class="sidebar surface" id="sidebar">
      <div class="sidebar__brand">
        <img src="assets/beacon-logo.jpg" class="sidebar__logo" alt="Beacon logo">
        Beacon
      </div>
      <nav class="sidebar__nav">
        <a class="sidebar__link" href="index.html">🏠 Dashboard</a>
        <a class="sidebar__link" href="tasks.html">✅ Tasks</a>
        <a class="sidebar__link" href="expenses.html">💳 Expenses</a>
        <a class="sidebar__link" href="budget.html">🎯 Budget</a>
        <a class="sidebar__link" href="calendar.html">📅 Calendar</a>
        <a class="sidebar__link" href="analytics.html">📊 Analytics</a>
        <a class="sidebar__link" href="profile.html">👤 Profile</a>
      </nav>
      <button class="btn btn-ghost" id="export-data-btn">⬇ Export data</button>
    </aside>

    <div class="app-content">
      <header class="topbar">
        <button class="icon-btn" id="sidebar-toggle" aria-label="Toggle menu">☰</button>
        <span class="topbar__title">Beacon</span>
      </header>

      <main class="main">
        <div class="container">
          <div class="page-header">
            <div>
              <h1 class="page-header__title">Expenses</h1>
              <p class="page-header__subtitle">Running total for current filters: <strong id="running-total-label">$0.00</strong></p>
            </div>
            <button class="btn btn-primary" id="add-expense-btn">+ New Expense</button>
          </div>

          <div class="toolbar">
            <div class="filter-group">
              <input class="input" type="search" id="search-input" placeholder="Search expenses…" style="max-width:200px;">
              <select class="select" id="category-filter-select" style="min-width:170px;"></select>
              <input class="input" type="date" id="date-from" style="max-width:150px;" aria-label="From date">
              <input class="input" type="date" id="date-to" style="max-width:150px;" aria-label="To date">
            </div>
            <button class="btn btn-ghost" id="clear-filters-btn">Clear filters</button>
          </div>

          <div class="content-grid">
            <section class="panel surface" style="padding:16px;">
              <div class="panel__list" id="expense-full-list" style="max-height:none;"></div>
            </section>

            <aside style="display:flex;flex-direction:column;gap:16px;">
              <div class="chart-card glass tilt">
                <div class="tilt-content">
                  <div class="chart-card__header"><h2>By category</h2></div>
                  <div class="chart-wrap">
                    <canvas id="category-donut" width="220" height="220" style="width:180px;height:180px;"></canvas>
                    <div class="chart-legend" id="category-legend"></div>
                  </div>
                </div>
              </div>

              <div class="chart-card glass tilt">
                <div class="tilt-content">
                  <div class="chart-card__header"><h2>Last 6 months</h2></div>
                  <canvas id="monthly-bar" style="width:100%;height:180px;"></canvas>
                </div>
              </div>
            </aside>
          </div>
        </div>
      </main>

      <footer class="site-footer">Search, or filter by category and date range, to see your spend shift in real time.</footer>
    </div>
  </div>

  <!-- Expense Editor Modal (shared for add + edit) -->
  <div class="modal-overlay" id="expense-editor-modal" aria-hidden="true">
    <div class="modal glass glass-strong">
      <div class="modal__header">
        <h3 id="expense-editor-title">New expense</h3>
        <button class="modal__close icon-btn" data-close-modal aria-label="Close">✕</button>
      </div>
      <form id="expense-editor-form">
        <div class="field">
          <label for="ee-title">Description</label>
          <input class="input" id="ee-title" name="title" required placeholder="e.g. Mess bill">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="ee-amount">Amount</label>
            <input class="input" id="ee-amount" name="amount" type="number" step="0.01" min="0" required placeholder="0.00">
          </div>
          <div class="field">
            <label for="ee-date">Date</label>
            <input class="input" id="ee-date" name="date" type="date">
          </div>
        </div>
        <div class="field">
          <label for="ee-category">Category</label>
          <select class="select" id="ee-category" name="category"></select>
        </div>
        <div class="field">
          <label for="ee-notes">Notes (optional)</label>
          <textarea class="textarea" id="ee-notes" name="notes" placeholder="Any extra detail..."></textarea>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn-danger" id="expense-delete-btn" style="display:none;margin-right:auto;">Delete</button>
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">Save Expense</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/expenses.js"></script>
</body>
</html>
