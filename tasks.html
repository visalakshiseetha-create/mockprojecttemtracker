<!--
  FILE: tasks.html
  ROLE: The Tasks module. Full CRUD task list with status and
  priority filters, priority chips, a task category (Academic/
  Personal/Other per spec), complete toggling, and drag-to-reorder.
  Logic in js/app.js (shared) + js/tasks.js (page).
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beacon — Tasks</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/glass-3d.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-background"></div>
  <div class="orb orb-1"></div>

  <div class="app-shell">
    <aside class="sidebar surface" id="sidebar">
      <div class="sidebar__brand">
        <img src="assets/beacon-logo.jpg" class="sidebar__logo" alt="Beacon logo">
        Beacon
      </div>
      <nav class="sidebar__nav">
        <a class="sidebar__link" href="index.html">🏠 Dashboard</a>
        <a class="sidebar__link" href="tasks.html">✅ Tasks</a>
        <a class="sidebar__link" href="expenses.html">💳 Expenses</a>
        <a class="sidebar__link" href="budget.html">🎯 Budget</a>
        <a class="sidebar__link" href="calendar.html">📅 Calendar</a>
        <a class="sidebar__link" href="analytics.html">📊 Analytics</a>
        <a class="sidebar__link" href="profile.html">👤 Profile</a>
      </nav>
      <button class="btn btn-ghost" id="export-data-btn">⬇ Export data</button>
    </aside>

    <div class="app-content">
      <header class="topbar">
        <button class="icon-btn" id="sidebar-toggle" aria-label="Toggle menu">☰</button>
        <span class="topbar__title">Beacon</span>
      </header>

      <main class="main">
        <div class="container">
          <div class="page-header">
            <div>
              <h1 class="page-header__title">Tasks</h1>
              <p class="page-header__subtitle" id="tasks-count-label">0 pending · 0 total</p>
            </div>
            <button class="btn btn-primary" id="add-task-btn">+ New Task</button>
          </div>

          <div class="toolbar">
            <div class="filter-group" role="group" aria-label="Filter by status">
              <button class="chip-filter is-active" data-status-filter="all">All</button>
              <button class="chip-filter" data-status-filter="pending">Pending</button>
              <button class="chip-filter" data-status-filter="complete">Complete</button>
            </div>
            <div class="filter-group" role="group" aria-label="Filter by priority">
              <button class="chip-filter is-active" data-priority-filter="all">Any priority</button>
              <button class="chip-filter" data-priority-filter="low">Low</button>
              <button class="chip-filter" data-priority-filter="medium">Medium</button>
              <button class="chip-filter" data-priority-filter="high">High</button>
            </div>
          </div>

          <section class="panel surface" style="max-width:820px;">
            <div class="panel__list" id="task-full-list" style="max-height:none;"></div>
          </section>
        </div>
      </main>

      <footer class="site-footer">Drag the ⠿ handle to reorder your tasks.</footer>
    </div>
  </div>

  <!-- Task Editor Modal (shared for add + edit) -->
  <div class="modal-overlay" id="task-editor-modal" aria-hidden="true">
    <div class="modal glass glass-strong">
      <div class="modal__header">
        <h3 id="task-editor-title">New task</h3>
        <button class="modal__close icon-btn" data-close-modal aria-label="Close">✕</button>
      </div>
      <form id="task-editor-form">
        <div class="field">
          <label for="te-title">Title</label>
          <input class="input" id="te-title" name="title" required placeholder="What needs to get done?">
        </div>
        <div class="field">
          <label for="te-notes">Notes (optional)</label>
          <textarea class="textarea" id="te-notes" name="notes" placeholder="Any extra detail..."></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="te-due">Due date</label>
            <input class="input" id="te-due" name="dueDate" type="date">
          </div>
          <div class="field">
            <label for="te-priority">Priority</label>
            <select class="select" id="te-priority" name="priority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="te-category">Category</label>
          <select class="select" id="te-category" name="category">
            <option value="academic">🎓 Academic</option>
            <option value="personal">🧑 Personal</option>
            <option value="other">🗂️ Other</option>
          </select>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn-danger" id="task-delete-btn" style="display:none;margin-right:auto;">Delete</button>
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
